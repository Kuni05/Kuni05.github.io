<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <button><div class="navicon"></div></button>
        <!-- 1. 给 ul 添加 flex 样式 -->
        <ul class="visible-links" style="display: flex; align-items: center;">
          <li class="masthead__menu-item masthead__menu-item--lg masthead__menu-home-item"><a href="#about-me">Homepage</a></li>
          {% for link in site.data.navigation.main %}
            <li class="masthead__menu-item"><a href="{{ domain }}{{ link.url }}">{{ link.title }}</a></li>
          {% endfor %}

          <!-- 2. 给 CV 所在的 li 添加 margin-left: auto，这会把后面所有元素推向右侧 -->
          <li class="masthead__menu-item" style="margin-left: auto;">
            <a href="{{ "/files/CV.pdf" | relative_url }}">CV</a>
          </li>

          <li class="masthead__menu-item" style="opacity: 0.6; cursor: default;">
            <span style="font-size: 0.85em;">Updated: {{ site.time | date: "%Y-%m-%d" }}</span>
          </li>
          
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
    </div>
  </div>
</div>
