<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <button><div class="navicon"></div></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg masthead__menu-home-item"><a href="#about-me">Homepage</a></li>
          {% for link in site.data.navigation.main %}
            <li class="masthead__menu-item"><a href="{{ domain }}{{ link.url }}">{{ link.title }}</a></li>
          {% endfor %}

          <li class="masthead__menu-item">
          <a href="#competitions">Other</a>
          </li>

          <!-- 新增：CV 选项（样式与其他相同） -->
          <li class="masthead__menu-item">
            <a href="{{ "/files/CV.pdf" | relative_url }}">CV</a>
          </li>

          <!-- EN/CN 语言切换（CN 页待发布） -->
          <li class="masthead__menu-item" style="opacity: 0.75; padding-right: 0.2em;">
            <a href="/" style="font-size: 0.8em; font-weight: bold; color: inherit; text-decoration: none;">EN</a><span style="font-size: 0.8em; color: #bbb; margin: 0 3px;">/</span><a href="/cn/" style="font-size: 0.8em; color: #bbb; text-decoration: none;">CN</a>
          </li>

          <!-- 分隔符 -->
          <li class="masthead__menu-item" style="opacity: 0.3; cursor: default; padding: 0 0.2em;">
            <span style="font-size: 0.85em;">|</span>
          </li>

          <!-- 新增：网站更新时间（使用稍微浅一点的颜色以示区分） -->
          <li class="masthead__menu-item" style="opacity: 0.6; cursor: default;">
            <span style="font-size: 0.85em;">Updated: {{ site.time | date: "%Y-%m-%d" }}</span>
          </li>
          
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
    </div>
  </div>
</div>
